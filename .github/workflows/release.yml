name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, v<GMX_VERSION_NAME>
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches the project version
        run: |
          version=$(grep '^GMX_VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "${TAG}" != "v${version}" ]; then
            echo "Tag ${TAG} does not match GMX_VERSION_NAME v${version} in gradle.properties" >&2
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "Secret KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/gmx-release.keystore"

      - name: Build signed release and debug
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/gmx-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --stacktrace :app:assembleRelease :app:assembleDebug

      - name: Verify signatures and prepare assets
        run: |
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          release=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          debug=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          "${apksigner}" verify --verbose --print-certs "${release}"
          "${apksigner}" verify "${debug}"
          cp "${release}" "GMX-${TAG}.apk"
          cp "${debug}" "GMX-${TAG}-debug.apk"
          sha256sum "GMX-${TAG}.apk" > "GMX-${TAG}.apk.sha256"
          sha256sum "GMX-${TAG}-debug.apk" > "GMX-${TAG}-debug.apk.sha256"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Write release notes
        run: |
          if ! python3 tools/changelog.py --tag "${TAG}" > release-notes.md 2> changelog.log; then
            echo "::warning title=Changelog::tools/changelog.py failed; using GitHub's generated notes only"
            : > release-notes.md
          fi
          if [ -s changelog.log ]; then
            cat changelog.log
            while IFS= read -r line; do echo "::warning title=Changelog::${line}"; done < changelog.log
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${TAG}" in
            *-*) flags="--prerelease" ;;
          esac
          notes=(--generate-notes)
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          fi
          gh release create "${TAG}" \
            "GMX-${TAG}.apk" "GMX-${TAG}.apk.sha256" \
            "GMX-${TAG}-debug.apk" "GMX-${TAG}-debug.apk.sha256" \
            --title "GMX ${TAG#v}" --target "${GITHUB_SHA}" \
            "${notes[@]}" ${flags}

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/gmx-release.keystore"
